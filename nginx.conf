# Imagen de producción del frontend (etapa `prod` del Dockerfile): sirve el build
# estático. Cualquier ruta que no sea un archivo devuelve index.html, así React
# Router resuelve /pacientes/:id y demás al recargar la página.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /assets/ {
    # Vite agrega un hash al nombre de cada archivo de assets/: no cambian nunca.
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    # index.html no se cachea: es el que apunta a los assets del build vigente.
    add_header Cache-Control "no-cache";
  }
}
